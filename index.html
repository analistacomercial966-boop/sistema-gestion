<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeo de Clientes</title>
    <style>
        :root {
            --primary: #8a00ff;
            --primary-dark: #6d00cc;
            --primary-soft: #f3e8ff;
            --bg: #f4f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #cbd5e1;
            --ok: #16a34a;
            --error: #dc2626;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
        }
        .container {
            background: var(--card);
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 440px;
        }
        #pantallaPanel { max-width: 720px; }
        h2 { text-align: center; margin: 0 0 24px; color: var(--primary); font-size: 24px; }

        /* Cabecera del panel */
        .header-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
        }
        .header-panel h2 { margin: 0; text-align: left; font-size: 20px; }
        .usuario-activo { font-size: 13px; color: var(--muted); word-break: break-all; }
        .btn-logout {
            background: #ef4444; color: #fff; border: none;
            padding: 8px 14px; border-radius: 8px; cursor: pointer;
            font-weight: 600; font-size: 13px; flex-shrink: 0;
        }

        /* Formulario */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
        .full { grid-column: 1 / -1; }
        .form-group { margin-bottom: 18px; position: relative; }
        label { display: block; margin-bottom: 7px; font-weight: 600; font-size: 13px; color: #334155; text-transform: uppercase; letter-spacing: .3px; }
        label .req { color: var(--error); }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: #fff;
            color: var(--text);
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(138,0,255,.15); }
        input[readonly] { background: #f1f5f9; color: var(--muted); font-weight: 600; }
        input:disabled { background: #f1f5f9; cursor: not-allowed; }
        input.invalido { border-color: var(--error); }
        .ayuda { font-size: 12px; color: var(--muted); margin-top: 5px; min-height: 14px; }

        /* Buscador con lista desplegable */
        .combo-lista {
            position: absolute; left: 0; right: 0; top: 100%;
            z-index: 20; margin: 4px 0 0; padding: 4px 0; list-style: none;
            background: #fff; border: 1px solid var(--border); border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,.10);
            max-height: 240px; overflow-y: auto; display: none;
        }
        .combo-lista.abierta { display: block; }
        .combo-lista li { padding: 10px 12px; cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
        .combo-lista li.activo, .combo-lista li:hover { background: var(--primary-soft); }
        .combo-lista li .codigo { color: var(--muted); font-size: 12px; white-space: nowrap; }
        .combo-lista li.vacio { color: var(--muted); cursor: default; background: none; }

        button.principal {
            width: 100%; padding: 14px; margin-top: 6px;
            background: var(--primary); color: #fff; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        button.principal:hover { background: var(--primary-dark); }
        button:disabled { opacity: .6; cursor: wait; }
        .btn-secundario {
            width: 100%; padding: 12px; margin-top: 8px;
            background: #fff; color: var(--muted); border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .mensaje { text-align: center; margin-top: 14px; font-size: 14px; font-weight: 500; min-height: 18px; }
        .mensaje.error { color: var(--error); }
        .mensaje.ok { color: var(--ok); }
        .mensaje.info { color: #d97706; }

        /* Responsive: tablet y celular */
        @media (max-width: 640px) {
            body { padding: 16px; align-items: flex-start; }
            .container { padding: 22px 18px; border-radius: 12px; }
            .grid { grid-template-columns: 1fr; }
            h2 { font-size: 21px; }
            .header-panel h2 { font-size: 17px; }
            input[type="text"], input[type="email"], input[type="password"] { font-size: 16px; } /* evita zoom en iPhone */
            .combo-lista { max-height: 200px; }
        }
    </style>
</head>
<body>

<!-- PANTALLA 1: INICIO DE SESIÓN -->
<div id="pantallaLogin" class="container">
    <h2>Acceso al Sistema</h2>
    <form id="formLogin" autocomplete="on">
        <div class="form-group">
            <label for="usuarioLogin">Usuario / Correo</label>
            <input type="email" id="usuarioLogin" placeholder="ejemplo@correo.com" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="passwordLogin">Contraseña</label>
            <input type="password" id="passwordLogin" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="principal" id="btnIngresar">Ingresar al Sistema</button>
        <div id="errorLogin" class="mensaje error"></div>
    </form>
</div>

<!-- PANTALLA 2: MAPEO DE CLIENTE (OCULTA AL INICIO) -->
<div id="pantallaPanel" class="container" style="display: none;">
    <div class="header-panel">
        <div>
            <h2>Mapeo de Cliente</h2>
            <div class="usuario-activo" id="saludoUsuario"></div>
        </div>
        <button type="button" class="btn-logout" onclick="cerrarSesion()">Salir</button>
    </div>

    <form id="formMapeo" autocomplete="off">
        <div class="grid">
            <div class="form-group full">
                <label for="cliente">Cliente <span class="req">*</span></label>
                <input type="text" id="cliente" placeholder="🔍 Escribe el nombre o código del cliente...">
                <ul class="combo-lista"></ul>
                <div class="ayuda" id="ayudaCliente"></div>
            </div>

            <div class="form-group">
                <label for="codCliente">Cod_Cliente</label>
                <input type="text" id="codCliente" readonly placeholder="Se llena automáticamente">
            </div>

            <div class="form-group">
                <label for="formato">Formato Comercial <span class="req">*</span></label>
                <input type="text" id="formato" placeholder="Buscar formato...">
                <ul class="combo-lista"></ul>
            </div>

            <div class="form-group">
                <label for="distrito">Distrito <span class="req">*</span></label>
                <input type="text" id="distrito" placeholder="Buscar distrito...">
                <ul class="combo-lista"></ul>
            </div>

            <div class="form-group">
                <label for="nombreMercado">Nombre Mercado <span class="req">*</span></label>
                <input type="text" id="nombreMercado" placeholder="Nombre del negocio">
                <ul class="combo-lista"></ul>
                <div class="ayuda" id="ayudaMercado"></div>
            </div>

            <div class="form-group">
                <label for="modelo">Modelo de Negocio <span class="req">*</span></label>
                <input type="text" id="modelo" placeholder="Buscar modelo...">
                <ul class="combo-lista"></ul>
            </div>

            <div class="form-group">
                <label for="giro">Giro (Core Business) <span class="req">*</span></label>
                <input type="text" id="giro" placeholder="Buscar giro...">
                <ul class="combo-lista"></ul>
            </div>
        </div>

        <button type="submit" class="principal" id="btnGuardar">ENTER</button>
        <button type="button" class="btn-secundario" onclick="limpiarFormulario()">Limpiar / Otro cliente</button>
        <div id="status" class="mensaje"></div>
    </form>
</div>

<script>
    // ================== CONFIGURACIÓN ==================
    const CONFIG = {
        urlAPI: 'https://sheetdb.io/api/v1/l9h7ddlpndgqv',
        hojaRegistro: 'registro',
        hojaMercados: 'mercados',            // columnas: DISTRITO | NOMBRE DEL MERCADO
        hojaFormatos: 'formato comercial',   // columna: Formato Comercial
        hojaModelos: 'modelo de negocio',    // columna: Modelo de Negocio
        hojaGiros: 'core business',          // columna: Core Business
        // Campo del formulario -> encabezado en la fila 1 de la hoja "registro" (escrito exactamente igual)
        columnasRegistro: {
            usuario: 'usuario',
            codCliente: 'cod_cliente',
            cliente: 'Cliente',
            formato: 'formato comercial',
            distrito: 'distrito',
            mercado: 'nombre del mercado',
            modelo: 'modelo de negocio',
            giro: 'core business',
            fecha: 'Fecha'
        },
        usuarioAdmin: 'analistacomercial@correo.com',
        // SHA-256 de la contraseña (no se guarda en texto plano).
        // Para cambiarla: en la consola del navegador (F12) ejecutar
        //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('NUEVA_CLAVE')).then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('')))
        hashClave: '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92',
        hojasVendedores: ['leo', 'ericka', 'elizabeth', 'marcos', 'ines', 'wilder'],
        aliasVendedor: { leonidas: 'leo' }
    };

    // ================== ESTADO ==================
    let usuarioActivo = '';
    let mercadosPorDistrito = {}; // { 'lima': ['MERCADO MIRONES BAJO', ...] }
    let columnasFaltantes = [];   // encabezados de CONFIG.columnasRegistro que no existen en la hoja "registro"

    const $ = id => document.getElementById(id);
    const normalizar = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
    const unicos = arr => [...new Set(arr.map(x => String(x || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));

    // ================== BUSCADOR CON LISTA (COMBO) ==================
    // opciones: [{ texto, codigo }]. estricto = solo acepta valores de la lista.
    function crearCombo(idInput, { estricto = true, alElegir = null } = {}) {
        const input = $(idInput);
        const lista = input.nextElementSibling;
        const combo = { opciones: [], seleccion: null, estricto };
        let visibles = [], activo = -1;

        function pintar() {
            const q = normalizar(input.value);
            visibles = combo.opciones.filter(o => !q || normalizar(o.texto + ' ' + (o.codigo || '')).includes(q)).slice(0, 60);
            lista.innerHTML = '';
            if (!visibles.length) {
                if (!combo.estricto) { lista.classList.remove('abierta'); return; }
                const li = document.createElement('li');
                li.className = 'vacio';
                li.textContent = combo.opciones.length ? 'Sin coincidencias' : 'No hay opciones disponibles';
                lista.appendChild(li);
            }
            visibles.forEach((o, i) => {
                const li = document.createElement('li');
                if (i === activo) li.className = 'activo';
                const span = document.createElement('span');
                span.textContent = o.texto;
                li.appendChild(span);
                if (o.codigo) {
                    const cod = document.createElement('span');
                    cod.className = 'codigo';
                    cod.textContent = o.codigo;
                    li.appendChild(cod);
                }
                li.addEventListener('mousedown', e => { e.preventDefault(); elegir(o); });
                lista.appendChild(li);
            });
            lista.classList.add('abierta');
        }

        function elegir(o) {
            combo.seleccion = o;
            input.value = o.texto;
            input.classList.remove('invalido');
            lista.classList.remove('abierta');
            if (alElegir) alElegir(o);
        }

        input.addEventListener('focus', () => { activo = -1; pintar(); });
        input.addEventListener('input', () => {
            activo = -1;
            if (combo.seleccion) { combo.seleccion = null; if (alElegir) alElegir(null); }
            pintar();
        });
        input.addEventListener('blur', () => {
            lista.classList.remove('abierta');
            // Si escribió el texto exacto de una opción, se toma como seleccionada
            if (!combo.seleccion && input.value) {
                const exacta = combo.opciones.find(o => normalizar(o.texto) === normalizar(input.value));
                if (exacta) elegir(exacta);
            }
        });
        input.addEventListener('keydown', e => {
            const abierta = lista.classList.contains('abierta');
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!abierta) pintar();
                if (!visibles.length) return;
                activo = e.key === 'ArrowDown' ? (activo + 1) % visibles.length : (activo - 1 + visibles.length) % visibles.length;
                pintar();
                const li = lista.children[activo];
                if (li) li.scrollIntoView({ block: 'nearest' });
            } else if (e.key === 'Enter' && abierta && visibles.length) {
                e.preventDefault(); // Enter elige la opción, no envía el formulario
                elegir(visibles[activo >= 0 ? activo : 0]);
            } else if (e.key === 'Escape') {
                lista.classList.remove('abierta');
            }
        });

        combo.setOpciones = opciones => { combo.opciones = opciones; combo.seleccion = null; };
        combo.limpiar = () => { combo.seleccion = null; input.value = ''; input.classList.remove('invalido'); };
        combo.valor = () => combo.seleccion ? combo.seleccion.texto : (combo.estricto ? '' : input.value.trim());
        combo.input = input;
        return combo;
    }

    const aOpciones = arr => arr.map(t => ({ texto: t }));

    const comboCliente = crearCombo('cliente', {
        alElegir: o => { $('codCliente').value = o ? o.codigo : ''; }
    });
    const comboFormato = crearCombo('formato', { alElegir: () => actualizarMercado() });
    const comboDistrito = crearCombo('distrito', { alElegir: () => actualizarMercado() });
    const comboMercado = crearCombo('nombreMercado', { estricto: false });
    const comboModelo = crearCombo('modelo');
    const comboGiro = crearCombo('giro');

    // Regla: con FORMATO = Mercado de Abastos, NOMBRE MERCADO solo muestra los mercados del distrito elegido
    // (hoja "mercados"). Con cualquier otro formato, NOMBRE MERCADO es texto libre.
    function esFormatoMercado() {
        return normalizar(comboFormato.valor()).startsWith('mercado de abastos');
    }

    function actualizarMercado() {
        const ayuda = $('ayudaMercado');
        comboMercado.limpiar();
        comboMercado.estricto = esFormatoMercado();
        if (!comboMercado.estricto) {
            comboMercado.setOpciones([]);
            comboMercado.input.disabled = false;
            comboMercado.input.placeholder = 'Nombre del negocio';
            ayuda.textContent = '';
            return;
        }
        const distrito = comboDistrito.valor();
        if (!distrito) {
            comboMercado.setOpciones([]);
            comboMercado.input.disabled = true;
            comboMercado.input.placeholder = 'Primero elige el distrito';
            ayuda.textContent = '';
            return;
        }
        const mercados = mercadosPorDistrito[normalizar(distrito)] || [];
        comboMercado.setOpciones(aOpciones(mercados));
        comboMercado.input.disabled = false;
        comboMercado.input.placeholder = 'Buscar mercado...';
        ayuda.textContent = mercados.length + ' mercado(s) en ' + distrito;
    }

    // ================== API (SheetDB / Google Sheets) ==================
    async function leerHoja(hoja) {
        try {
            const res = await fetch(CONFIG.urlAPI + '?sheet=' + encodeURIComponent(hoja));
            if (!res.ok) return [];
            const data = await res.json();
            return Array.isArray(data) ? data : [];
        } catch (e) {
            console.warn('No se pudo leer la hoja: ' + hoja, e);
            return [];
        }
    }

    // Busca una columna sin importar mayúsculas, tildes, espacios o guiones bajos
    function columna(fila, nombre) {
        const clave = normalizar(nombre).replace(/[\s_]/g, '');
        const k = Object.keys(fila).find(c => normalizar(c).replace(/[\s_]/g, '') === clave);
        return k ? String(fila[k] || '').trim() : '';
    }

    async function cargarClientes(hojas) {
        const resultados = await Promise.all(hojas.map(leerHoja));
        const porCodigo = new Map();
        resultados.flat().forEach(f => {
            const nombre = columna(f, 'Cliente');
            const codigo = columna(f, 'Codigocliente') || columna(f, 'COD_CLIENTE');
            if (nombre && !porCodigo.has(codigo || nombre)) porCodigo.set(codigo || nombre, { texto: nombre, codigo });
        });
        return [...porCodigo.values()].sort((a, b) => a.texto.localeCompare(b.texto, 'es'));
    }

    // Devuelve los encabezados de una hoja (endpoint /keys de SheetDB)
    async function leerColumnas(hoja) {
        try {
            const res = await fetch(CONFIG.urlAPI + '/keys?sheet=' + encodeURIComponent(hoja));
            const data = res.ok ? await res.json() : [];
            return Array.isArray(data) ? data : [];
        } catch (e) {
            console.warn('No se pudieron leer las columnas de: ' + hoja, e);
            return [];
        }
    }

    async function cargarCatalogos() {
        const [filasMercados, filasFormatos, filasModelos, filasGiros, columnasReg] = await Promise.all([
            leerHoja(CONFIG.hojaMercados), leerHoja(CONFIG.hojaFormatos), leerHoja(CONFIG.hojaModelos),
            leerHoja(CONFIG.hojaGiros), leerColumnas(CONFIG.hojaRegistro)
        ]);

        mercadosPorDistrito = {};
        const nombresDistrito = [];
        filasMercados.forEach(f => {
            const d = columna(f, 'DISTRITO'), m = columna(f, 'NOMBRE DEL MERCADO');
            if (!d || !m) return;
            nombresDistrito.push(d);
            (mercadosPorDistrito[normalizar(d)] = mercadosPorDistrito[normalizar(d)] || []).push(m);
        });
        Object.keys(mercadosPorDistrito).forEach(k => { mercadosPorDistrito[k] = unicos(mercadosPorDistrito[k]); });

        const lista = (filas, col) => unicos(filas.map(f => columna(f, col)));
        comboFormato.setOpciones(aOpciones(lista(filasFormatos, 'Formato Comercial')));
        comboDistrito.setOpciones(aOpciones(unicos(nombresDistrito)));
        comboModelo.setOpciones(aOpciones(lista(filasModelos, 'Modelo de Negocio')));
        comboGiro.setOpciones(aOpciones(lista(filasGiros, 'Core Business')));

        const existentes = columnasReg.map(c => String(c).trim());
        columnasFaltantes = Object.values(CONFIG.columnasRegistro).filter(c => !existentes.includes(c));

        [[filasMercados, CONFIG.hojaMercados], [filasFormatos, CONFIG.hojaFormatos],
         [filasModelos, CONFIG.hojaModelos], [filasGiros, CONFIG.hojaGiros]].forEach(([filas, hoja]) => {
            if (!filas.length) console.warn('Hoja "' + hoja + '" vacía o inexistente.');
        });
    }

    function avisoColumnasFaltantes() {
        return 'La hoja "' + CONFIG.hojaRegistro + '" no tiene estas columnas en la fila 1: ' + columnasFaltantes.join(', ') +
               '. Agrégalas (escritas igual) y vuelve a ingresar.';
    }

    // ================== LOGIN ==================
    async function sha256(texto) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
        return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    $('formLogin').addEventListener('submit', async e => {
        e.preventDefault();
        const usuario = $('usuarioLogin').value.trim().toLowerCase();
        const clave = $('passwordLogin').value;
        const error = $('errorLogin');
        const btn = $('btnIngresar');
        error.textContent = '';

        if (!usuario || !clave) { error.textContent = 'Por favor, completa todos los campos.'; return; }
        if (await sha256(clave) !== CONFIG.hashClave) { error.textContent = 'Usuario o contraseña incorrectos.'; return; }

        const esAdmin = usuario === CONFIG.usuarioAdmin;
        let hojas;
        if (esAdmin) {
            hojas = CONFIG.hojasVendedores;
        } else {
            let vendedor = usuario.split('@')[0];
            vendedor = CONFIG.aliasVendedor[vendedor] || vendedor;
            if (!CONFIG.hojasVendedores.includes(vendedor)) { error.textContent = 'Usuario o contraseña incorrectos.'; return; }
            hojas = [vendedor];
        }

        btn.disabled = true;
        btn.textContent = 'Cargando datos...';
        try {
            const [clientes] = await Promise.all([cargarClientes(hojas), cargarCatalogos()]);
            if (!clientes.length) { error.textContent = 'No se encontraron clientes en Google Sheets.'; return; }
            comboCliente.setOpciones(clientes);
            usuarioActivo = usuario;
            $('saludoUsuario').textContent = (esAdmin ? 'Administrador: ' : 'Vendedor: ') + usuario + ' · ' + clientes.length + ' clientes';
            $('pantallaLogin').style.display = 'none';
            $('pantallaPanel').style.display = 'block';
            $('passwordLogin').value = '';
            limpiarFormulario();
            if (columnasFaltantes.length) {
                $('status').className = 'mensaje error';
                $('status').textContent = avisoColumnasFaltantes();
            }
        } catch (err) {
            console.error(err);
            error.textContent = 'Error de conexión al cargar los datos.';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Ingresar al Sistema';
        }
    });

    function cerrarSesion() {
        usuarioActivo = '';
        comboCliente.setOpciones([]);
        limpiarFormulario();
        $('status').textContent = '';
        $('pantallaPanel').style.display = 'none';
        $('pantallaLogin').style.display = 'block';
    }

    function limpiarFormulario() {
        [comboCliente, comboFormato, comboDistrito, comboModelo, comboGiro].forEach(c => c.limpiar());
        $('codCliente').value = '';
        actualizarMercado();
    }

    // ================== GUARDAR ==================
    $('formMapeo').addEventListener('submit', async e => {
        e.preventDefault();
        const status = $('status');
        const campos = [
            [comboCliente, 'Cliente'], [comboFormato, 'Formato comercial'], [comboDistrito, 'Distrito'],
            [comboMercado, 'Nombre mercado'], [comboModelo, 'Modelo de negocio'], [comboGiro, 'Giro']
        ];
        const faltan = campos.filter(([c]) => !c.valor());
        campos.forEach(([c]) => c.input.classList.toggle('invalido', !c.valor()));
        if (faltan.length) {
            status.className = 'mensaje error';
            status.textContent = 'Completa o elige de la lista: ' + faltan.map(f => f[1]).join(', ') + '.';
            return;
        }

        // Sin todas las columnas, SheetDB descarta en silencio los campos que no encuentra
        if (columnasFaltantes.length) {
            status.className = 'mensaje error';
            status.textContent = avisoColumnasFaltantes();
            return;
        }

        const C = CONFIG.columnasRegistro;
        const registro = {
            [C.usuario]: usuarioActivo,
            [C.codCliente]: $('codCliente').value,
            [C.cliente]: comboCliente.valor(),
            [C.formato]: comboFormato.valor(),
            [C.distrito]: comboDistrito.valor(),
            [C.mercado]: comboMercado.valor(),
            [C.modelo]: comboModelo.valor(),
            [C.giro]: comboGiro.valor(),
            [C.fecha]: new Date().toLocaleString('es-PE')
        };

        const btn = $('btnGuardar');
        btn.disabled = true;
        status.className = 'mensaje info';
        status.textContent = 'Guardando...';
        try {
            const res = await fetch(CONFIG.urlAPI + '?sheet=' + encodeURIComponent(CONFIG.hojaRegistro), {
                method: 'POST',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: [registro] })
            });
            const resultado = await res.json();
            if (resultado.created === 1) {
                status.className = 'mensaje ok';
                status.textContent = '¡Guardado! ' + registro[C.codCliente] + ' - ' + registro[C.cliente];
                limpiarFormulario();
            } else {
                status.className = 'mensaje error';
                status.textContent = 'El servidor no guardó el registro. Revisa que exista la hoja "' + CONFIG.hojaRegistro + '".';
            }
        } catch (err) {
            console.error(err);
            status.className = 'mensaje error';
            status.textContent = 'Fallo de conexión al guardar.';
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
